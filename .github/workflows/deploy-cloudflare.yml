name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [preview, production]
        default: preview

# `contents: read` is all that is needed: nothing is written back to the repo.
permissions:
  contents: read

# Never run two deploys for the same ref at once.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Cloudflare Pages project name. This is NOT auto-detected: it must
  # match the project you created in Cloudflare. Override it without editing
  # this file by adding a repository variable named PAGES_PROJECT
  # (Settings -> Secrets and variables -> Actions -> Variables).
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'mlbb-draft-coach' }}

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  preview:
    name: Preview deploy
    needs: verify
    # The Cloudflare credentials live in an environment, not at repository
    # level, so the job has to name that environment. Without this the
    # secrets resolve to an empty string and wrangler reports a missing
    # CLOUDFLARE_API_TOKEN.
    environment: cf
    # Forks do not get repository secrets, so only deploy same-repo branches.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.target == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Both values are integers, never free-form text, so nothing here can
      # inject a shell command. A PR branch name could not be trusted this way.
      PAGES_BRANCH: >-
        pr-${{ github.event.pull_request.number || github.run_number }}
      # Read the Google Search Console site-verification token from the cf
      # environment's variables (Settings -> Environments -> cf). The Vite
      # plugin in vite.config.ts reads process.env.GOOGLE_SITE_VERIFICATION
      # at build time and injects the meta tag into index.html.
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run build

      # `wrangler whoami` exits 0 even when unauthenticated, so it cannot be
      # used as a gate. Asking the API instead proves three things at once:
      # the token is valid, it has Pages access, and the project exists.
      - name: Verify credentials and project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or unset.
              Add it under Settings -> Secrets and variables -> Actions
              -> Secrets."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or unset.
              Add it under Settings -> Secrets and variables -> Actions
              -> Secrets."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          body="${RUNNER_TEMP:-/tmp}/cf-response.json"
          status=$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare rejected the request (HTTP $status)."
            grep -o '"message":"[^"]*"' "$body" || cat "$body"
            echo "The token needs Account -> Cloudflare Pages -> Edit.
              The built-in 'Edit Cloudflare Workers' template does not
              grant it."
            exit 1
          fi
          echo "Token is valid and the Pages project \"$PAGES_PROJECT\" exists."

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$PAGES_BRANCH" | tee deploy-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Preview deployment"
            grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' \
              deploy-output.txt | sort -u || true
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production deploy
    needs: verify
    # Must match the environment that holds the Cloudflare secrets; see
    # preview.
    environment: cf
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same source as the preview job: environment variables on `cf`.
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run build

      # `wrangler whoami` exits 0 even when unauthenticated, so it cannot be
      # used as a gate. Asking the API instead proves three things at once:
      # the token is valid, it has Pages access, and the project exists.
      - name: Verify credentials and project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or unset.
              Add it under Settings -> Secrets and variables -> Actions
              -> Secrets."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or unset.
              Add it under Secrets and variables -> Actions -> Secrets."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          body="${RUNNER_TEMP:-/tmp}/cf-response.json"
          status=$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare rejected the request (HTTP $status)."
            grep -o '"message":"[^"]*"' "$body" || cat "$body"
            echo "The token needs Account -> Cloudflare Pages -> Edit.
              The built-in 'Edit Cloudflare Workers' template does not
              grant it."
            exit 1
          fi
          echo "Token is valid and the Pages project \"$PAGES_PROJECT\" exists."

      # --branch must match the Pages project's production branch, otherwise
      # Cloudflare treats the upload as a preview deployment.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main | tee deploy-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deployment"
            grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' \
              deploy-output.txt | sort -u || true
          } >> "$GITHUB_STEP_SUMMARY"
